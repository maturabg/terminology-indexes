rate_limit: { rps: 1, daily: null }
guards: { max_row_drop: 0.2 }
contact: null
notes: "Индекс + live: индексът държи само заглавията (enwiktionary и bgwiktionary); check по pageid проверява live, че има езикова секция English/Български."
