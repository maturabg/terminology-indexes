golden:
  - { query: "abstract data type", expect: "abstractDataType" }
  - { query: "DAG", expect: "directAcycGraph" }
contact: null
notes: "Целият азбучен индекс е началната страница (fetch.url): заглавие → URL, „X: see Y“ → redirect етикет. Дефинициите (1100+ страници) не се теглят — при 0.2 rps това е над час на refresh, затова на практика няма snippet. Ако се добавят: записи с бележка „CRC Press“ или друг copyright — без snippet."
