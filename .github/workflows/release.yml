name: release

# Manual build + publish. Iteration 3 replaces this with the scheduled refresh.yml.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Source ids, space separated"
        default: "python_glossary"
      replace:
        description: "Replace today's release if it already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: index-refresh
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCES: ${{ inputs.sources }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-dev

      - name: Tag
        run: |
          tag="index-$(date -u +%Y%m%d)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          if gh release view "$tag" > /dev/null 2>&1; then
            if [ "${{ inputs.replace }}" != "true" ]; then
              echo "::error::$tag already exists; rerun with replace=true"
              exit 1
            fi
            gh release delete "$tag" --cleanup-tag --yes
          fi

      - name: Build
        run: |
          args=()
          for s in $SOURCES; do args+=(--source "$s"); done
          uv run idx build "${args[@]}" --release-tag "$TAG"
          uv run idx query decorator
          uv run idx manifest -o manifest.json

      - name: Compress
        run: |
          mkdir dist
          zstd -19 -q index.sqlite -o dist/index.sqlite.zst
          for f in shards/shard-*.sqlite; do zstd -19 -q "$f" -o "dist/$(basename "$f").zst"; done
          cp manifest.json dist/
          ls -la dist

      - name: Publish
        run: |
          {
            echo "Sources: $SOURCES"
            echo
            echo '```json'
            cat manifest.json
            echo '```'
          } > notes.md
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --latest
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
