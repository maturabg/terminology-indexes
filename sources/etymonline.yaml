id: etymonline
name: "Online Etymology Dictionary"
site_no: "20"
home: "https://www.etymonline.com/"
mode: index
status: active
iteration: 7
fetch:
  method: sitemap
  url: "https://www.etymonline.com/sitemap.xml"
  checksum_url: null
refresh: "P30D"
langs: [en]
kind_default: term
stable_id: lemma_path
check: "index_lookup"
license:
  class: restricted
  url: "https://www.etymonline.com/legal/terms"
  checked_at: 2026-10-14
snippet_policy: none
attribution: "Etymonline"
rate_limit: { rps: 0.2, daily: null }
guards: { max_row_drop: 0.2 }
golden:
  - { query: "firewall", expect: "firewall" }
  - { query: "e mail", expect: "e-mail" }
contact: null
notes: "Само каталог лема → URL (/word/{lemma}) от sitemap (/sitemap.xml → /sitemaps/words-en.xml, ~47 000 леми), без съдържание. robots.txt позволява /word/ и обявява sitemap-а. Вътрешните /api/ маршрути не се ползват. Хешът е на лемите — lastmod се мени и без нова дума."
